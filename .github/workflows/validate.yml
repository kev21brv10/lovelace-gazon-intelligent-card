name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dev dependencies
        run: npm ci

      - name: Committed .gz decompresses to committed .js
        run: python3 scripts/check_bundle_sync.py gazon-intelligent-card.js.gz

      - name: Build bundle
        run: python3 scripts/build.py

      - name: Bundle source in sync (text, deterministic)
        # Le .js est une concaténation déterministe des sources ; le .gz est exclu
        # car la compression gzip n'est pas reproductible octet pour octet d'une
        # plateforme à l'autre (vérifié à l'étape précédente via décompression).
        run: git diff --exit-code -- gazon-intelligent-card.js

      - name: JS syntax check
        run: node --check gazon-intelligent-card.js

      - name: Validate contract
        run: python3 scripts/validate.py

      - name: Contract tests (source)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Behavioral tests (jsdom)
        run: npm test
